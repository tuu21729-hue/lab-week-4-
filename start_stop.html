<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset = "UTF-8">
    <title> Start Stop Fun</title>
    </head>
    <body>
        <button id = "Start1">Start</button>
        <button id = "Stop1">Stop</button>
        <button id = "Start2">Start</button>
        <button id = "Stop2">Stop</button>
        <button id = "Start3">Start</button>
        <button id = "Stop3">Stop</button>
    <script>

        const ctx = new AudioContext()

        const myGain = new GainNode(ctx);
        myGain.gain.value = 0.125;

        myGain.connect(ctx.destination);

        document.querySelector("#Start1").onclick = () =>
    {
        ctx.resume();
        osc1 = new OscillatorNode (ctx)
        osc1.frequency.value = 110
        osc1.type = "triangle"

        osc2 = new OscillatorNode (ctx)
        osc2.frequency.value = 110 * 1.01
        osc2.type = "triangle"

        osc3 = new OscillatorNode (ctx)
        osc3.frequency.value = 110 * 0.99
        osc3.type = "triangle"

        osc1.connect(myGain)
        osc2.connect(myGain)
        osc3.connect(myGain)

        osc1.start()
        osc2.start()
        osc3.start()
    }

    document.querySelector("#Stop1").onclick = () =>

    {

        osc1.stop()
        osc2.stop()
        osc3.stop()
       
    }

       document.querySelector("#Start2").onclick = () =>
    {
        ctx.resume();
        osc4 = new OscillatorNode (ctx)
        osc4.frequency.value = 165
        osc4.type = "triangle"

        osc5 = new OscillatorNode (ctx)
        osc5.frequency.value = 165 * 1.01
        osc5.type = "triangle"

        osc6 = new OscillatorNode (ctx)
        osc6.frequency.value = 165 * 0.99
        osc6.type = "triangle"

        osc4.connect(myGain)
        osc5.connect(myGain)
        osc6.connect(myGain)

        osc4.start()
        osc5.start()
        osc6.start()
    }

    document.querySelector("#Stop2").onclick = () =>

    {

        osc4.stop()
        osc5.stop()
        osc6.stop()
       
    }
    </script>
    
    </body>
</html>
